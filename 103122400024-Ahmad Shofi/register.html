<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-container">
        <div class="register-box">
            <h1>Register</h1>
            <p class="register-description">
                Silakan isi data diri Anda
            </p>
            <form>
                <!-- NAMA -->
                <label for="nama">Nama Lengkap</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >

                <!-- ALAMAT -->
                <label for="alamat">Alamat</label>
                <textarea
                    id="alamat"
                    name="alamat"
                    placeholder="Masukkan alamat lengkap"
                    rows="4"
                    required
                ></textarea>

                <!-- NO HP -->
                <label for="nohp">No. HP</label>
                <input
                    type="tel"
                    id="nohp"
                    name="nohp"
                    placeholder="08xxxxxxxxxx"
                    required
                >

                <!-- TANGGAL LAHIR -->
                <label for="tanggal_lahir">
                    Tanggal Lahir
                </label>
                <input
                    type="date"
                    id="tanggal_lahir"
                    name="tanggal_lahir"
                    required
                >


                <!-- GENDER -->
                <label>Gender</label>
                <div class="gender">
                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Laki-laki"
                            required
                        >
                        Laki-laki
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Perempuan"
                        >
                        Perempuan
                    </label>
                </div>

                <!-- BUTTON -->
                <button type="submit">
                    Register
                </button>
            </form>

            <p class="back">
                <a href="index.html">
                    Kembali ke CV
                </a>
            </p>
        </div>
    </div>

</body>
</html>
